name: Bug report
description: Something does not reload, does not start, or breaks on your setup
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, what you expected.
    validations:
      required: true
  - type: input
    id: nvim
    attributes:
      label: Neovim version
      description: The first line of `nvim --version`.
      placeholder: NVIM v0.11.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15.6, Ubuntu 24.04, Windows 11 with WSL2
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin version
      description: kitehost.nvim, from `git -C <plugin dir> describe --tags` or your lock file.
      placeholder: kitehost.nvim v2.0.0
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal config
      description: The smallest `setup({...})` and plugin spec that reproduces it. Replace a fixed `token` value with `<redacted>` before pasting.
      render: lua
  - type: textarea
    id: health
    attributes:
      label: Diagnostics
      description: The output of `:messages` after the failure. Replace a `?t=<token>` query in a pasted URL with `?t=<redacted>`.
      render: text
